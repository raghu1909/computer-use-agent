[project]
name = "computer-use-agent"
version = "0.1.0"
description = "LLM discovers a UI flow once; the recorded capability replays deterministically with no model in the loop."
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.49",
    "pydantic>=2.5",
    "flask>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "anthropic>=0.40",
    "python-multipart>=0.0.9",
]

[project.scripts]
cua = "cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "B904", "E731"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint.per-file-ignores]
"src/agent/prompts.py" = ["E501"]
"src/handoff/server.py" = ["E501"]
"src/surface/browser.py" = ["E501"]
